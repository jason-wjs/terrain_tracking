[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "terrain-tracking"
version = "0.1.0"
description = "Blind terrain tracking tasks for Unitree G1 built on mjlab."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab[cu128]==1.3.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "trimesh>=4.8",
]

[project.entry-points."mjlab.tasks"]
terrain_tracking = "terrain_tracking._mjlab_tasks"

[tool.uv.sources]
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
mujoco = { index = "mujoco" }
mujoco-warp = { git = "https://github.com/google-deepmind/mujoco_warp", rev = "ea7f05b" }

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "mujoco"
url = "https://py.mujoco.org"
explicit = true

[tool.uv]
override-dependencies = ["mujoco==3.7.1.dev901297952"]

[dependency-groups]
dev = [
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "ruff>=0.14.14",
]

[tool.ruff]
src = ["src", "tests"]
indent-width = 2

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pyright]
pythonVersion = "3.10"
ignore = []
stubPath = "typings"
reportWildcardImportFromLibrary = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
